<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LILY LE MIERE.exe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
  cursor: url('https://cur.cursors-4u.net/cursors/cur-9/cur817.cur'), auto;
}

body {
  margin: 0;
  background:
    url("https://www.transparenttextures.com/patterns/stardust.png"),
    linear-gradient(#0400ff, #000);
  color: white;
  font-family: Verdana, sans-serif;
}

/* HEADER */

.header {
  background: linear-gradient(90deg, hotpink, cyan, lime);
  padding: 20px;
  border-bottom: 4px ridge white;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-family: 'Press Start 2P', cursive;
  font-size: 24px;
  text-shadow: 4px 4px black;
}

.status {
  margin-top: 15px;
  font-family: 'VT323', monospace;
  font-size: 28px;
  color: yellow;
}

/* LAYOUT */

.container {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  padding: 20px;
}

/* SIDEBAR */

.sidebar {
  background: rgba(0,0,0,0.7);
  border: 3px outset #ccc;
  padding: 15px;
}

.profile-pic {
  width: 100%;
  border: 4px ridge hotpink;
}

.about-button {
  display: block;
  margin-top: 15px;
  padding: 12px;
  text-align: center;
  background: black;
  border: 3px ridge hotpink;
  color: lime;
  font-family: 'VT323', monospace;
  font-size: 30px;
  text-decoration: none;
}

.about-button:hover {
  background: hotpink;
  color: black;
}

/* RETRO MUSIC BUTTON */

.music-button {
  display: block;
  margin-top: 15px;
  padding: 12px;
  text-align: center;
  background: black;
  border: 3px ridge cyan;
  color: yellow;
  font-family: 'VT323', monospace;
  font-size: 26px;
  cursor: pointer;
}

.music-button:hover {
  background: cyan;
  color: black;
}

.music-player {
  margin-top: 20px;
  background: black;
  padding: 10px;
  border: 2px inset white;
  font-family: 'VT323', monospace;
  font-size: 24px;
  color: lime;
}

.counter {
  text-align: center;
  margin-top: 20px;
  font-family: 'VT323', monospace;
  font-size: 30px;
  color: cyan;
}

/* MAIN */

.main {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.window {
  background: #c0c0c0;
  color: black;
  border: 3px outset white;
  box-shadow: 8px 8px 0px black;
}

.window-header {
  background: navy;
  color: white;
  padding: 8px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

/* PROJECTS */

.projects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.projects a {
  text-decoration: none;
  color: inherit;
}

.project {
  background: white;
  border: 3px ridge hotpink;
  padding: 10px;
  transition: 0.2s;
}

.project:hover {
  transform: rotate(-2deg) scale(1.03);
}

.project img {
  width: 100%;
  height: 250px;
  object-fit: contain;
  background: white;
}

/* COMMENTS */

.guestbook-entry {
  background: white;
  padding: 10px;
  margin-bottom: 10px;
  border: 2px dashed blue;
}

/* STICKER */

.sticker {
  position: fixed;
  width: 100px;
  right: 20px;
  bottom: 20px;
  animation: spin 10s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

</style>
</head>

<body>

<div class="header">
  <h1>LILYLEMIERE.COM</h1>
  <div class="status">currently listening to: Masayoshi Takanaka ✩°｡⋆</div>
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <img class="profile-pic" src="images_/My face.jpg">

    <a href="about.html" class="about-button">
      ABOUT_ME.exe
    </a>

    <button class="music-button" id="playMusic">
      ▶ PLAY MUSIC
    </button>

    <div class="music-player">
      NOW PLAYING: BREEZIN'.mp3
    </div>

    <div class="counter">
      visitor count: 000709
    </div>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="window">
      <div class="window-header">
        TOP PROJECTS.exe
      </div>

      <div class="window-content">

        <div class="projects">

          <a href="project-1.html">
            <div class="project">
              <img src="images_/aoopen.png">
              <h3>Aus_0p3n.zip</h3>
            </div>
          </a>

          <a href="project-2.html">
            <div class="project">
              <img src="images_/partneropen.png">
              <h3>A0_Partnerships.psd</h3>
            </div>
          </a>

          <a href="project-3.html">
            <div class="project">
              <img src="images_/matesvilleopen.png">
              <h3>MatesV1lle.co</h3>
            </div>
          </a>

          <a href="project-4.html">
            <div class="project">
              <img src="images_/pinkpom.png">
              <h3>P1nkP0ms.zip</h3>
            </div>
          </a>

        </div>

      </div>
    </div>

  </div>

</div>

<!-- AUDIO -->
<audio id="bgmusic" loop>
  <source src="audio_/home/BREEZIN.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("playMusic").addEventListener("click", function () {
  const music = document.getElementById("bgmusic");
  music.play();
  this.innerHTML = "♫ NOW PLAYING";
});
</script>

</body>
</html>
